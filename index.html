<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle Financeiro</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <form>
         <div class="titulo">
            <h1>Controle Financeiro</h1>
            <p>Login</p>
        </div>
        <div class="email">
            <div><label>E-mail</label></div>
            <input type="email" id="email" name="email" onchange="alteracaoEmail()" placeholder="Digite seu e-mail"/>
            <div class="erro" id="erro-email-obrigatorio">E-mail é obrigatório</div>
            <div class="erro" id="erro-email-invalido">E-mail é inválido</div>
        </div>
        <div class="password">
            <div><label>Senha</label></div>
            <input type="password" id="password" name="password" onchange="alteracaoSenha()" placeholder="Digite sua senha"/>
            <div class="erro" id="erro-senha-obrigatoria">Senha é obrigatório</div>
        </div>
        <div class="recuperar-senha">
            <button type="button" id="botao-recuperar-senha" disabled="true" >Recuperar Senha</button>
        </div>
        <div class="entrar">
            <button type="button" id="botao-entrar" disabled="true" onclick="login()">Entrar</button>
        </div>
        <div class="registrar">
            <button type="button" onclick="register()">Registrar</button>
        </div>
    </form>
</body>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="index.js"></script>
<script src="validation.js"></script>

</html>
